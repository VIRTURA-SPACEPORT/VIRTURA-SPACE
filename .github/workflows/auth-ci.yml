name: Auth CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'functions/**'
      - 'config/**'
      - 'tests/**'
      - 'supabase/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/auth-ci.yml'
  push:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
